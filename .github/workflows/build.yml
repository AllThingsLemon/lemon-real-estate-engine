# Builds the engine against the demo client content on every push and PR.
# main is live for every client, so nothing merges unless this passes.
# deploy-all.yml also calls this before rebuilding client sites.
name: Build check
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TEMPLATE_REPO: ${{ vars.TEMPLATE_REPO || 'allthingslemon/lemon-real-estate-template' }}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch demo client content
        run: git clone --depth 1 "https://github.com/${TEMPLATE_REPO}.git" client
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
